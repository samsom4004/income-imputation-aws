[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "income-imputation-aws"
version = "0.1.0"
description = "Multiple imputation of missing income in survey data, redesigned as an end-to-end ML solution for Amazon SageMaker and Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samsom Yebio" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.0",
  "scipy>=1.9",
  "joblib>=1.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
aws = ["boto3>=1.34", "sagemaker>=2.200,<3"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.27", "boto3>=1.34"]

[project.scripts]
income-imputation = "income_imputation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
